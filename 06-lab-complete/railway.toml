# ============================================================
# Railway — config as code (tiêu chí 12)
# Docs: https://docs.railway.com/reference/config-as-code
#
# Biến môi trường đặt trên Railway (không ghi vào file này):
#   AGENT_API_KEY  (secret)        REDIS_URL  (tham chiếu service Redis: ${{Redis.REDIS_URL}})
#   ENVIRONMENT=production         RATE_LIMIT_PER_MINUTE, DAILY_BUDGET_USD, MONTHLY_BUDGET_USD
# PORT do Railway tự cấp; CMD trong Dockerfile đọc ${PORT:-8000}.
# ============================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway chỉ chuyển traffic sang bản deploy mới khi /health trả 200
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
