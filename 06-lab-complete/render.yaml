# ============================================================
# Render Blueprint (tiêu chí 12) — có thể dùng thay railway.toml
# Docs: https://render.com/docs/blueprint-spec
# Render → New → Blueprint → chọn repo; Render đọc file này.
# (Bài nộp deploy bằng Railway; file này chưa được deploy thử trên Render.)
# ============================================================
services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      # Secret: Render tự sinh giá trị ngẫu nhiên, không ghi vào git
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []   # chỉ cho phép kết nối nội bộ từ các service trên Render
